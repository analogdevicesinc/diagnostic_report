name: Build and Deploy Diagnostic Report

env:
  APP_NAME: diagnostic-report

permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '20[1-9][0-9]_R[1-9]'
      - staging/*
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - '20[1-9][0-9]_R[1-9]'

jobs:
  identify_version:
    runs-on: ubuntu-latest
    outputs:
      app-version: ${{ steps.set_version.outputs.version }}
      can-create-release: ${{ steps.set_version.outputs.can_create_release}}
    steps:
    - name: Checkout code repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set app version
      id: set_version
      run: |
        # Regex to match semantic versioning (from semver.org)
        # Regex will match valid version number https://regex101.com/r/jPSdnV/1
        regex='^(v|)((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?)$'
        app_version=""
        create_release=false
        latest_released_tag=$(curl "https://api.github.com/repos/${{github.repository}}/releases/latest" | jq -r .tag_name)

        if [[ "${{github.ref_type}}" == "tag" ]]; then
            pushed_tag="${{github.ref_name}}"
            if [[ "$pushed_tag" =~ $regex  ]]; then
                app_version="${BASH_REMATCH[2]}"
                if [[ "$latest_released_tag" =~ $regex  ]]; then
                    IFS='.' read -r major minor patch <<< "${BASH_REMATCH[2]}"
                    next_patch="$major.$minor.$((patch + 1))"
                    next_minor="$major.$((minor + 1)).0"
                    next_major="$((major + 1)).0.0"
                    if [[ "$app_version" == "$next_patch" || "$app_version" == "$next_minor" || "$app_version" == "$next_major" ]]; then
                        create_release=true
                    else
                        echo "Valid tag, but invalid version incrementation, release will NOT be created"
                    fi
                else
                    echo "Invalid relesed version, skip incrementation validation! Release will be created"
                    create_release=true
                fi
            else
                echo "Invalid tag format, release will NOT be created"
                app_version=0.0.1+${{ github.sha }}
            fi
        else
            if [[ "$latest_released_tag" =~ $regex  ]]; then
                app_version=${BASH_REMATCH[2]}+${{ github.sha }}
            else
                echo "Invalid relesed version. Setting default version"
                app_version=0.0.1+${{ github.sha }}
            fi
        fi

        echo "Version to use $app_version"
        echo "version=$app_version" >> "$GITHUB_OUTPUT"
        echo "can_create_release=$create_release" >> "$GITHUB_OUTPUT"
  build_containerized:
    runs-on: ubuntu-26.04-arm
    needs: identify_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - docker_image: docker.cloudsmith.io/adi/containers/kuiper_basic_64@sha256:2a4b203ca34cf660339f8d8a5b32d290ae3c4918e18c0473902e2c12c86ca129
            architecture: arm64
            platform_flag: ""
          - docker_image: docker.cloudsmith.io/adi/containers/kuiper_basic_32@sha256:ce9c5eba9dc120595e42142665aa11ded7317181c01c14c190e86835cfef9c8a
            architecture: armhf
            platform_flag: "--platform linux/arm/v7"
    steps:
    - name: Checkout code repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        path: ${{env.APP_NAME}}

    - name: Checkout deb-generator action
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        repository: analogdevicesinc/shared-actions
        ref: 37bf277259e5f1d464dd786b73756c7812a14eb4
        path: shared-actions

    - name: Start persistent container
      run: |
        docker run -d \
            ${{matrix.platform_flag}} \
            --name kuiper-${{matrix.architecture}} \
            -v "$GITHUB_WORKSPACE/${{env.APP_NAME}}:/workspace/${{env.APP_NAME}}" \
            -v "$GITHUB_WORKSPACE/shared-actions:/workspace/shared-actions" \
            -w /workspace/${{env.APP_NAME}} \
            ${{matrix.docker_image}} tail -f /dev/null

    - name: Create debian package
      run: |
        docker exec -e VERSION=${{needs.identify_version.outputs.app-version}} kuiper-${{matrix.architecture}} bash /workspace/shared-actions/deb-generator-action/build-deb.sh

    - name: Install application
      run: |
        docker exec kuiper-${{matrix.architecture}} sh -c "sudo dpkg -i /workspace/${{env.APP_NAME}}/artifacts/*.deb"

    - name: Verify install locations
      run: |
        docker exec kuiper-${{matrix.architecture}} sh -c ".github/scripts/verify_install.sh"

    - name: Copy .deb from container to host
      run: |
        mkdir -p dist
        docker cp "kuiper-${{matrix.architecture}}:/workspace/${{env.APP_NAME}}/artifacts/." dist/

    - name: Upload .deb artifacts to github
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{env.APP_NAME}}-${{matrix.architecture}}
        path: dist/*.deb
        if-no-files-found: error
  build_native:
    runs-on: ${{matrix.runner}}
    needs: identify_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            distro: ubuntu-26.04
            architecture: amd64
          - runner: ubuntu-24.04
            distro: ubuntu-24.04
            architecture: amd64
    defaults:
      run:
        working-directory: ${{env.APP_NAME}}
    steps:
    - name: Checkout code repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        path: ${{env.APP_NAME}}

    - name: Create .deb package
      id: build_deb
      uses: analogdevicesinc/shared-actions/deb-generator-action@37bf277259e5f1d464dd786b73756c7812a14eb4 # main
      with:
        version: ${{needs.identify_version.outputs.app-version}}
        working-directory: ${{env.APP_NAME}}

    - name: Install application
      run: |
        sudo dpkg -i ${{steps.build_deb.outputs.artifact-dir}}/*.deb

    - name: Verify install locations
      run: |
        .github/scripts/verify_install.sh

    - name: Tag package with distro
      # Keep release asset names distinct across distros of the same arch.
      run: |
        for deb in "${{steps.build_deb.outputs.artifact-dir}}"/*.deb; do
          mv "$deb" "${deb%.deb}_${{matrix.distro}}.deb"
        done

    - name: Upload .deb artifacts to github
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{env.APP_NAME}}-${{matrix.distro}}-${{matrix.architecture}}
        path: ${{steps.build_deb.outputs.artifact-dir}}/*.deb
        if-no-files-found: error
  create_release_from_tag:
    needs:
      - build_containerized
      - build_native
      - identify_version
    runs-on: ubuntu-latest
    if: ${{needs.identify_version.outputs.can-create-release == 'true'}}
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        merge-multiple: true
    - name: Release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        token: ${{secrets.TOKEN_GITHUB}}
        name: Release ${{github.ref_name}}
        artifacts: ${{env.APP_NAME}}_*.deb

